# Datasets and AMICI checkpoints behind each main figure of the AMICI manuscript.
# Paths are relative to the repository root. md5 sums were verified on 2026-10-16 against the files that
# reproduce the published panels (gene selections, heatmap orders, violin order and hub labels; see README.md).
# Remote copies: Figshare doi:10.6084/m9.figshare.31927956 (version 1, files listed by id) and gs://justin-amici.

figure_1:
  status: schematic only; no data or checkpoint

figure_2:
  status: >-
    2a-e from the original PBMC run (2a from the run's GITIII input and ground-truth subtype files, 2b from its
    length_scale_distribution.svg). 2f from the realistic dataset below. 2h-j kept as published: Source Data are
    the published bar heights (read off a vector copy of the figure) with the realistic re-run alongside. 2g
    redrawn from the re-run's selected AMICI model, 14 heads and seed 42 (source_data/plot_fig2g.py).
  realistic_rerun:
    config: reproducibility/benchmarks/fig2_realistic_benchmark_config.yaml
    amici_sweep: benchmarks/results_realistic_rerun_april_family/  # 30 runs; test losses and AUPRCs in reproducibility/benchmarks/fig2_realistic_april_sweep_scores.csv
    amici_model: benchmarks/results_realistic_rerun_april_family/breast_cancer_42/saved_models/amici_breast_cancer_42_best_model/model.pt  # 14 heads, seed 42
    amici_model_md5: 9bc5b8181fff5bb8ad676fdf88028378
    gcs: gs://justin-amici/semisyn/fig2_realistic_april_sweep/  # selected model, its scores (scores/run_329/), sweep logs, MANIFEST.md5
    gitiii: ../amici-3a3cc16/benchmarks/results/breast_cancer_42/  # re-run at commit 3a3cc16
    dataset: benchmarks/results_realistic_rerun/data/breast_cancer_42.h5ad  # copy of data/breast_cancer_42.h5ad
    dataset_md5: 1e185c0bddb7795d30e8729d289ad8d3
  original_run: khushi-gpu-migrated:/home/khushidesai/amici_results (28 GB)
  staged_copy: gs://justin-amici/semisyn/fig2_amici_results/  # 288 files + 2 seed-72 files; md5s in fig2_manifest.txt and fig2_manifest_addendum.txt
  local_copy: benchmarks/results_fig2_original/
  amici_models: >-
    3ct_dataset_2way_{seed}/saved_models/amici_3ct_dataset_2way_{seed}_best_model/model.pt for all ten seeds
    (40, 123, 6, 23, 25, 88, 72, 58, 22, 31); md5s in fig2_manifest.txt. The models under benchmarks/results/
    on the AMICI VM are from a later re-run and are not the published ones.
  example_seed: 72
  datasets: >-
    The original 3ct_dataset_2way_{seed}.h5ad files were not kept. benchmarks/data/ holds later regenerations
    that do not match the original models (495/500 shared genes, different cell counts).
  pipeline: benchmarks/Snakefile with benchmarks/benchmark_config.yaml

