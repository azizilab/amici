    scripts:
      - benchmarks/sensitivity_scripts/amici_variants (8a, 8b, 8c, 8d)
      - benchmarks/sensitivity_scripts/neighbor_occlusion_analysis.py (8e, 8f)
      - benchmarks/sensitivity_scripts/matched_neighbor_occlusion_analysis.py (8g)
      - benchmarks/sensitivity_scripts/neutral_sampling_negative_control.py (8h, 8i)
    note: >-
      Every panel is semisynthetic. The scripts generate their own PBMC and realistic datasets and
      train the variant and occlusion models internally under benchmarks/sensitivity_scripts/saved_models/,
      so this figure needs no deposited checkpoint or dataset. 8f, 8h and 8i need a rerun: the PR curves
      are drawn from memory and only the AUPRC summaries are written.
    assets: []

  - id: ed9
    title: Extended Data Fig. 9 - noise, multiple-testing family, spatial dependence, stromal exclusion
    panels: 9a-i
    scripts:
      - benchmarks/sensitivity_scripts/coordinate_noise_sensitivity.py (9a)
      - benchmarks/sensitivity_scripts/family_wide_bh_interaction_networks.py (9b, 9d, 9f)
      - benchmarks/sensitivity_scripts/spatial_block_jackknife_gene_significance.py (9c, 9e, 9g)
      - xenium/xenium_stromal_bleeding_analysis.py (9h, 9i)
    note: >-
      9a is semisynthetic and self-contained. 9b-g run the same two analyses over all three real
      datasets, so this figure needs the Xenium, Atera and tonsil models together. Both scripts reuse
      each dataset's cached all-cell-type ablation scores when present and recompute them from the
      checkpoint otherwise; the caches are 1.4-3 GB each and are not deposited.
    assets:
      - {ref: xenium_main_data, panels: "9b, 9c, 9h, 9i"}
      - {ref: xenium_main_model, panels: "9b, 9c, 9h, 9i"}
      - {ref: xenium_stromal_data, panels: "9h, 9i"}
      - {ref: xenium_stromal_model, panels: "9h, 9i"}
      - {ref: atera_main_data, panels: "9d, 9e"}
      - {ref: atera_main_model, panels: "9d, 9e"}
      - {ref: tonsil_main_data, panels: "9f, 9g"}
      - {ref: tonsil_main_model, panels: "9f, 9g"}

