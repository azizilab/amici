      - human_tonsil/human_tonsil_no_ribo_compare.py (6a)
      - human_tonsil/human_tonsil_fibroblast_attention_de.py (6b, 6c)
    note: >-
      6a compares the tonsil model retrained without the five ribosomal-protein genes, UBA52, FAU
      and MALAT1 against the published 1000-gene model, so it is the one panel in the manuscript
      that needs both checkpoints and both datasets at once. It reads each model's cached
      all-cell-type ablation scores and recomputes them from the checkpoint when absent. 6b and 6c
      split the fibroblasts by the attention CD4 T cells assign them and need the retrained model
      only.
    assets:
      - {ref: tonsil_main_data, panels: "6a"}
      - {ref: tonsil_main_model, panels: "6a"}
      - {ref: tonsil_no_ribo_data, panels: "6a-c"}
      - {ref: tonsil_no_ribo_model, panels: "6a-c"}

  - id: ed7
    title: Extended Data Fig. 7 - model selection, attention stability, hyperparameter sensitivity
    panels: 7a-i
    scripts:
      - atera_breast/atera_breast_attention_consistency.py (7a)
      - human_tonsil/human_tonsil_attention_consistency.py (7b)
      - benchmarks/sensitivity_scripts/test_region_composition_diagnostic.py (7c, 7d)
      - benchmarks/sensitivity_scripts/value_penalty_analysis.py (7e)
      - benchmarks/sensitivity_scripts/attention_penalty_analysis.py (7f)
      - benchmarks/sensitivity_scripts/head_analysis.py (7g)
      - benchmarks/sensitivity_scripts/neighbor_analysis.py (7h)
      - xenium/xenium_null_z_distribution.py (7i)
    note: >-
      7a and 7b are the only panels that need a whole sweep rather than one checkpoint: both scripts
      walk the local wandb/ directory, join each run's summary to its saved model and compare attention
      across runs. The full sweeps are deposited, together with each run's wandb-summary.json and
      config.yaml - the two files collect_sweep_runs() reads - so the panels can be rebuilt without the
      350 MB of W&B logs. 7c-h train their own models inside the sensitivity scripts. 7i needs a rerun.
    assets:
      - {ref: atera_main_data, panels: "7a"}
      - {ref: atera_sweep, panels: "7a"}
      - {ref: atera_wandb, panels: "7a"}
      - {ref: tonsil_main_data, panels: "7b"}
      - {ref: tonsil_selection_sweep, panels: "7b"}
      - {ref: tonsil_wandb, panels: "7b"}
      - {ref: xenium_main_data, panels: "7i"}
      - {ref: xenium_main_model, panels: "7i"}

  - id: ed8
    title: Extended Data Fig. 8 - threshold sensitivity, hub stability, multi-scale interactions, monotonicity
    panels: 8a-k
    scripts:
      - benchmarks/length_scale_task/sensitivity_test.py (8a)
      - xenium/xenium_niche_analysis.py (8b, 8c)
      - benchmarks/sensitivity_scripts/2_phase/ (8e, 8f)
      - benchmarks/sensitivity_scripts/unimodal_two_phase/ (8g, 8i)
      - human_tonsil/human_tonsil_empirical_distance_expression.py (8j)
      - benchmarks/make_monotonicity_figure.py (8k)
    note: >-
      8d and 8h are spatial maps. 8a needs a rerun. 8e-g and 8i are two-phase and unimodal
      semisynthetic studies that generate their data and train their models internally. 8j reads the
      no-ribosomal tonsil dataset directly and needs no checkpoint. 8k reads figures/monotonicity/monotonicity_by_pair.csv,
      which benchmarks/make_monotonicity_figure.py writes from the per-dataset analyses.
    assets:
      - {ref: xenium_main_data, panels: "8b, 8c"}
      - {ref: xenium_main_model, panels: "8b, 8c"}
      - {ref: tonsil_no_ribo_data, panels: "8j"}

  - id: ed9
    title: Extended Data Fig. 9 - attention variants, neighbor occlusion, negative controls
    panels: 9a-i
    scripts:
      - benchmarks/sensitivity_scripts/amici_variants (9a, 9b, 9c, 9d)
      - benchmarks/sensitivity_scripts/neighbor_occlusion_analysis.py (9e, 9f)
      - benchmarks/sensitivity_scripts/matched_neighbor_occlusion_analysis.py (9g)
      - benchmarks/sensitivity_scripts/neutral_sampling_negative_control.py (9h, 9i)
    note: >-
      Every panel is semisynthetic. The scripts generate their own PBMC and realistic datasets and
      train the variant and occlusion models internally under benchmarks/sensitivity_scripts/saved_models/,
      so this figure needs no deposited checkpoint or dataset. 9f, 9h and 9i need a rerun: the PR curves
      are drawn from memory and only the AUPRC summaries are written.
    assets: []

  - id: ed10
    title: Extended Data Fig. 10 - noise, multiple-testing family, spatial dependence, stromal exclusion
    panels: 10a-i
    scripts:
      - benchmarks/sensitivity_scripts/coordinate_noise_sensitivity.py (10a)
      - benchmarks/sensitivity_scripts/family_wide_bh_interaction_networks.py (10b, 10d, 10f)
      - benchmarks/sensitivity_scripts/spatial_block_jackknife_gene_significance.py (10c, 10e, 10g)
      - xenium/xenium_stromal_bleeding_analysis.py (10h, 10i)
    note: >-
      10a is semisynthetic and self-contained. 10b-g run the same two analyses over all three real
      datasets, so this figure needs the Xenium, Atera and tonsil models together. Both scripts reuse
      each dataset's cached all-cell-type ablation scores when present and recompute them from the
      checkpoint otherwise; the caches are 1.4-3 GB each and are not deposited.
    assets:
      - {ref: xenium_main_data, panels: "10b, 10c, 10h, 10i"}
      - {ref: xenium_main_model, panels: "10b, 10c, 10h, 10i"}
      - {ref: xenium_stromal_data, panels: "10h, 10i"}
      - {ref: xenium_stromal_model, panels: "10h, 10i"}
      - {ref: atera_main_data, panels: "10d, 10e"}
      - {ref: atera_main_model, panels: "10d, 10e"}
      - {ref: tonsil_no_ribo_data, panels: "10f, 10g"}
      - {ref: tonsil_no_ribo_model, panels: "10f, 10g"}

