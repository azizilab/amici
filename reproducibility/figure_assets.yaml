# Model checkpoints and datasets behind each figure of the AMICI manuscript, keyed by figure.
#
# This file is the single source of truth for the per-figure deposit. `stage_figure_assets.py` reads
# it, sends anything missing to whichever store is passed on the command line, and writes one
# MANIFEST.yaml and one fetch.sh per figure. Nothing is stored twice: the per-figure folders hold
# manifests and fetch scripts, and every asset lives once under <dataset>/data/ or
# <dataset>/saved_models/.
#
# Assets are named, never linked. `object` is a path relative to the root of the deposit, and it is
# the same path the asset has in the repository, so one name identifies the asset in any store it is
# staged to. The staging store is given with --store at deposit time and is deliberately absent from
# this file, because the published deposit is the Figshare record rather than any staging copy. Add a
# `figshare` file id per asset once the record is minted.
#
# `source_data/checkpoints.yaml` stays the provenance record for the main figures (W&B sweep/run ids,
# verified md5 sums, Figshare ids). This file is the coverage record: which figure needs what, and
# under what name a reader finds it.
#
# Asset fields:
#   kind       dataset | checkpoint | results
#   object     the asset's name: its path relative to the deposit root, or a prefix ending in / for a
#              directory of checkpoints
#   repo_path  where the analysis scripts expect it, relative to the repository root
#   local      path on the AMICI VM to upload from; omit when the deposit is the only copy
#   panels     the panels that need it
#   md5        recorded md5 of the object (directories record md5s in the manifest instead)
#   note       anything a reader needs to know before using it
#
# Extended Data numbering is the submitted numbering: ED 1-9 are the manuscript's Extended Data
# Figs. 1-9, panel letter for panel letter. It is NOT the pre-condensation Fig. S1-S40 numbering that
# REPRODUCIBILITY.md and the `supplementary:` block of source_data/checkpoints.yaml still use.

# Where the per-figure folders go inside the store that --store names.
by_figure_prefix: by_figure

