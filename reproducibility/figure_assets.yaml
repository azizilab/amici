          method, and the seed-72 files behind 2a. md5s in fig2_manifest.txt and
          fig2_manifest_addendum.txt. 288 files + 2.
      - kind: dataset
        object: semisyn/fig2_amici_results/3ct_dataset_2way_{seed}.h5ad
        repo_path: benchmarks/data/3ct_dataset_2way_{seed}.h5ad
        panels: 2a-e
        missing: true
        note: >-
          Not kept by the original run. benchmarks/data/ on the AMICI VM holds later regenerations
          that do not match the deposited models (495/500 shared genes, different cell counts), so
          they are not a substitute. Regenerate with benchmarks/generate_dataset.py to train afresh.
      - kind: dataset
