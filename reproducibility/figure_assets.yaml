      - benchmarks/Snakefile with reproducibility/benchmarks/fig2_realistic_benchmark_config.yaml (2f-j)
    note: >-
      2a-e come from the original PBMC run, whose ten per-seed AMICI models are deposited; its
      3ct_dataset_2way_{seed}.h5ad inputs were not kept, so those panels are reproducible from the
      deposited scores and models but not retrainable from the original data. 2f-j come from the
      realistic re-run; 2h-j are kept as published, and 2g is redrawn from the re-run model. See the
      Figure 2 section of source_data/README.md.
    assets:
      - kind: checkpoint
        object: semisyn/fig2_amici_results/
        repo_path: benchmarks/results_fig2_original
        panels: 2a-e
        note: >-
          Ten per-seed models at 3ct_dataset_2way_{seed}/saved_models/amici_3ct_dataset_2way_{seed}_best_model/model.pt
